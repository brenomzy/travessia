<script>
window.SHADERS = [
  { id: "k6", title: "6 \u00b7 5j as it was", note: 'The previous version, for comparison.', ref: "River lab 2, tile 5j",
    frag: `#define SHAPE 1
#define WATER 1
#define LINES 1.00
#define GLOW 0.10
#define EDGE 3

float rcx(float y, float t) {
#if SHAPE == 0
  return .68 + .12 * sin(y * 5. + .6) + .06 * sin(y * 11.3 + 1.9) + .03 * snoise(vec3(y * 3., 0., t * .03));
#else
  return .66 + .13 * sin(y * 4.2 + .6) + .05 * sin(y * 9.1 + 2.3) + .015 * sin(y * 17. + 1.) + .022 * snoise(vec3(y * 2.5, 0., t * .02));
#endif
}
float rw(float y, float t) {
#if SHAPE == 0
  return .05 + .022 * snoise(vec3(y * 4., 2., t * .02));
#else
  return mix(.074, .026, smoothstep(0., 1., y)) * (1. + .2 * snoise(vec3(y * 5., 3., t * .015)));
#endif
}
void main() {
  vec2 fc = gl_FragCoord.xy; vec2 uv = fc / uRes; float asp = uRes.x / uRes.y; float t = uTime; float y = uv.y;
  float e = .002; float cx = rcx(y, t); float sl = (rcx(y + e, t) - rcx(y - e, t)) / (2. * e) * asp;
  float w = rw(y, t);
  float dn = (uv.x - cx) * asp / sqrt(1. + sl * sl);
  float d = abs(dn) - w + .0035 * fbm3(vec3(uv * vec2(asp, 1.) * 26., 1.));
  float s = clamp(dn / w, -1., 1.);
  float depth = 1. - s * s;
  float flow = y * 3. + t * .1;
  float l1 = pow(1. - abs(snoise(vec3(s * 1.6, flow, t * .03))), 16.);
  float l2 = pow(1. - abs(snoise(vec3(s * 3.2, flow * 2.2 + 4., t * .05 + 2.))), 24.);
#if WATER == 0
  vec3 water = mix(LIGHT, DEEP, .45 * smoothstep(0., 1., abs(s)));
  water = mix(water, L200, clamp(l1 * .5 + l2 * .3, 0., 1.) * LINES);
#elif WATER == 1
  vec3 water = mix(L300, DEEP, depth * .75);
  water = mix(water, WHITE, clamp(l1 * .75 + l2 * .5, 0., 1.) * LINES);
  float crest = smoothstep(.75, 1., abs(s)) * smoothstep(-.2, .6, snoise(vec3(s, y * 22. + t * .35, 1.)));
  water = mix(water, mix(L200, WHITE, .6), crest * .6);
#elif WATER == 2
  vec3 water = mix(DEEP, D800, depth * .55);
  water = mix(water, mix(L200, WHITE, .5), clamp(l1 * .9 + l2 * .6, 0., 1.) * LINES);
  water = mix(water, L300, smoothstep(.8, 1., abs(s)) * .5);
#else
  vec3 water = mix(L200, LIGHT, smoothstep(0., 1., abs(s)));
  water = mix(water, WHITE, clamp(l1 * .6 + l2 * .4, 0., 1.) * LINES);
#endif
  float od = max(d, 0.);
  vec3 land = DARK + fbm3(vec3(uv * vec2(asp, 1.) * 3., 7.)) * .015;
#if EDGE == 0
  land *= 1. - .35 * exp(-od * 55.);
#endif
  land += LIGHT * GLOW * exp(-od * 14.) + DEEP * GLOW * .9 * exp(-od * 4.);
  float aa = fwidth(d) * 1.2;
  float inside = 1. - smoothstep(-aa, aa, d);
#if EDGE == 1
  inside = 1. - smoothstep(-.014, .018 + .012 * fbm3(vec3(uv * vec2(asp, 1.) * 9., t * .05)), d);
#elif EDGE == 2
  vec2 cc = floor(fc / (4. * uDpr));
  float band = smoothstep(.07, 0., d + .012 * fbm3(vec3(uv * vec2(asp, 1.) * 7., t * .04)));
  if (d > 0. && band > bayer4(cc)) { land = mix(L300, LIGHT, .5); }
#elif EDGE == 3
  float k = od * 55.;
  float ring = 1. - smoothstep(0., fwidth(k) * 1.1, abs(fract(k) - .5));
  land = mix(land, mix(L300, vec3(.75, .82, .85), smoothstep(0., .15, od)), ring * .45 * exp(-od * 9.) * step(.004, od));
#elif EDGE == 4
  land *= 1. - .5 * exp(-od * 35.);
  land += mix(L300, WHITE, .3) * exp(-abs(d) * 420.) * .7;
#elif EDGE == 5
  float g = grain(floor(fc / (2. * uDpr)) + floor(uTime * 3.) * 17.);
  land += mix(LIGHT, L300, .5) * .6 * step(g, exp(-od * 10.) * .5);
#endif
  gl_FragColor = vec4(mix(land, water, inside), 1.);
}
` },
  { id: "k6a", title: "6a \u00b7 Flow lines", note: 'The river drawn as fine stream lines on deep water, catching light as it moves downstream. The same line language as the echoes outside.', ref: "Echoes: anti-aliased, widening, drifting, broken up \u00b7 glow: none",
    frag: `#define WATER 1
#define GLOW 0.00
#define ECHO 22.0

float rcx(float y, float t) { return .66 + .13 * sin(y * 4.2 + .6) + .05 * sin(y * 9.1 + 2.3) + .015 * sin(y * 17. + 1.) + .022 * snoise(vec3(y * 2.5, 0., t * .02)); }
float rw(float y, float t) { return mix(.074, .026, smoothstep(0., 1., y)) * (1. + .2 * snoise(vec3(y * 5., 3., t * .015))); }
// A line about px pixels wide wherever k crosses a whole number.
float lineAA(float k, float px) {
  float fw = max(fwidth(k), 1e-4);
  float l = abs(fract(k - .5) - .5) / fw;
  return 1. - smoothstep(px * .5 - .5, px * .5 + .5, l);
}
float caustic(vec2 uv, float time) {
  vec2 p = mod(uv * 6.28318530718, 6.28318530718) - 250.0;
  vec2 i = vec2(p); float c = 1.0; float inten = .005;
  for (int n = 0; n < 5; n++) {
    float tt = time * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 5.0; c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}
void main() {
  vec2 fc = gl_FragCoord.xy; vec2 uv = fc / uRes; float asp = uRes.x / uRes.y; float t = uTime; float y = uv.y;
  vec2 P = vec2(uv.x * asp, uv.y);
  float e = .002; float cx = rcx(y, t); float sl = (rcx(y + e, t) - rcx(y - e, t)) / (2. * e) * asp;
  float w = rw(y, t);
  float dn = (uv.x - cx) * asp / sqrt(1. + sl * sl);
  float d = abs(dn) - w + .002 * fbm3(vec3(P * 26., 1.));
  float s = clamp(dn / w, -1., 1.);
  float depth = 1. - s * s;
  float od = max(d, 0.);

  // Land and the bank echoes: spacing widens outwards, lines drift away from the river and break up unevenly.
  vec3 land = DARK + fbm3(vec3(P * 3., 7.)) * .012;
  float wob = .006 * snoise(vec3(P * 5., t * .03));
  float ek = sqrt(max(od + wob, 0.)) * ECHO - t * .05;
  float breakup = smoothstep(-.6, .4, snoise(vec3(P * 2.2, t * .04 + 9.)));
  float echo = lineAA(ek, 1.) * exp(-od * 6.) * smoothstep(.002, .01, od) * (.35 + .65 * breakup);
  vec3 ec = mix(L300, vec3(.72, .8, .83), smoothstep(0., .22, od));
  land = mix(land, ec, clamp(echo, 0., 1.) * .55);
  land += LIGHT * GLOW * exp(-od * 14.) + DEEP * GLOW * .8 * exp(-od * 4.);

  vec3 water;
#if WATER == 1
  vec3 base = mix(D800, DEEP, depth * .8);
  float fk = s * 9. + .7 * snoise(vec3(s * .8, y * 1.2, t * .02));
  float shimmer = smoothstep(-.2, .8, snoise(vec3(s * 1.5, y * 5. + t * .25, t * .05)));
  water = mix(base, mix(L300, WHITE, shimmer * .6), lineAA(fk, 1.2) * (.3 + .7 * shimmer));
  water = mix(water, L300, smoothstep(.82, 1., abs(s)) * .3);
#elif WATER == 2
  water = mix(L300, DEEP, depth * .8);
  float c = caustic(P * 2.4 + vec2(0., t * .015), t * .32);
  water += c * mix(L200, WHITE, .55) * (.18 + .45 * depth);
  water += WHITE * .1 * smoothstep(.22, .0, abs(s - .35 + .12 * sin(y * 6. + t * .3)));
#elif WATER == 3
  float under = lineAA(sqrt(abs(dn) + .004 * snoise(vec3(P * 9., t * .1))) * ECHO * 1.6 + t * .05, 1.);
  water = mix(mix(DARK, DEEP, .8), mix(DEEP, LIGHT, .8), depth * .85);
  water = mix(water, mix(L200, WHITE, .4), under * (.25 + .35 * depth));
#elif WATER == 4
  water = mix(L300, DEEP, depth * .7);
  float silk = snoise(vec3(s * 2.5, y * .9 - t * .05, t * .02)) * .5 + .5;
  float silk2 = snoise(vec3(s * 6., y * 1.6 - t * .09, t * .03 + 3.)) * .5 + .5;
  water = mix(water, mix(L200, WHITE, .55), smoothstep(.55, 1., silk) * .5 + smoothstep(.72, 1., silk2) * .3);
#elif WATER == 5
  vec3 base = mix(DEEP, LIGHT, depth * .7);
  float fk = s * 8. + .7 * snoise(vec3(s * .8, y * 1.2, t * .02));
  float shimmer = smoothstep(-.3, .8, snoise(vec3(s * 1.5, y * 5. + t * .25, t * .05)));
  water = mix(base, WHITE, lineAA(fk, 1.2) * (.25 + .6 * shimmer));
#elif WATER == 6
  float f = depth * 1.2 + .25 * fbm3(vec3(P * 3., t * .03)) - t * .02;
  water = mix(mix(DARK, D800, .85), mix(L300, WHITE, depth * .5), lineAA(f * 14., 1.1) * (.45 + .55 * depth));
#else
  vec2 cc = floor(fc / (3. * uDpr));
  float cov = .3 + .7 * depth * (.75 + .25 * snoise(vec3(s * 2., y * 4. + t * .2, t * .05)));
  water = cov > bayer4(cc) ? LIGHT : DEEP;
#endif
  // A fine bright edge on the water side of the bank.
  water = mix(water, mix(L200, WHITE, .3), exp(-abs(d) * 700.) * .55);
  float aa = fwidth(d);
  float inside = 1. - smoothstep(-aa, aa, d);
  gl_FragColor = vec4(mix(land, water, inside), 1.);
}
` },

  float cov = .3 + .7 * depth * (.75 + .25 * snoise(vec3(s * 2., y * 4. + t * .2, t * .05)));
  water = cov > bayer4(cc) ? LIGHT : DEEP;
#endif
  // A fine bright edge on the water side of the bank.
  water = mix(water, mix(L200, WHITE, .3), exp(-abs(d) * 700.) * .55);
  float aa = fwidth(d);
  float inside = 1. - smoothstep(-aa, aa, d);
  gl_FragColor = vec4(mix(land, water, inside), 1.);
}
` },
  { id: "k6g", title: "6g \u00b7 Dithered water", note: 'The seam\u2019s dither inside the river, echoes outside. Joins the river to the texture we already use.', ref: "Echoes: anti-aliased, widening, drifting, broken up \u00b7 glow: none",
    frag: `#define WATER 7
#define GLOW 0.00
#define ECHO 22.0

float rcx(float y, float t) { return .66 + .13 * sin(y * 4.2 + .6) + .05 * sin(y * 9.1 + 2.3) + .015 * sin(y * 17. + 1.) + .022 * snoise(vec3(y * 2.5, 0., t * .02)); }
float rw(float y, float t) { return mix(.074, .026, smoothstep(0., 1., y)) * (1. + .2 * snoise(vec3(y * 5., 3., t * .015))); }
// A line about px pixels wide wherever k crosses a whole number.
float lineAA(float k, float px) {
  float fw = max(fwidth(k), 1e-4);
  float l = abs(fract(k - .5) - .5) / fw;
  return 1. - smoothstep(px * .5 - .5, px * .5 + .5, l);
}
float caustic(vec2 uv, float time) {
  vec2 p = mod(uv * 6.28318530718, 6.28318530718) - 250.0;
  vec2 i = vec2(p); float c = 1.0; float inten = .005;
  for (int n = 0; n < 5; n++) {
    float tt = time * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 5.0; c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}
void main() {
  vec2 fc = gl_FragCoord.xy; vec2 uv = fc / uRes; float asp = uRes.x / uRes.y; float t = uTime; float y = uv.y;
  vec2 P = vec2(uv.x * asp, uv.y);
  float e = .002; float cx = rcx(y, t); float sl = (rcx(y + e, t) - rcx(y - e, t)) / (2. * e) * asp;
  float w = rw(y, t);
  float dn = (uv.x - cx) * asp / sqrt(1. + sl * sl);
  float d = abs(dn) - w + .002 * fbm3(vec3(P * 26., 1.));
  float s = clamp(dn / w, -1., 1.);
  float depth = 1. - s * s;
  float od = max(d, 0.);

  // Land and the bank echoes: spacing widens outwards, lines drift away from the river and break up unevenly.
  vec3 land = DARK + fbm3(vec3(P * 3., 7.)) * .012;
  float wob = .006 * snoise(vec3(P * 5., t * .03));
  float ek = sqrt(max(od + wob, 0.)) * ECHO - t * .05;
  float breakup = smoothstep(-.6, .4, snoise(vec3(P * 2.2, t * .04 + 9.)));
  float echo = lineAA(ek, 1.) * exp(-od * 6.) * smoothstep(.002, .01, od) * (.35 + .65 * breakup);
  vec3 ec = mix(L300, vec3(.72, .8, .83), smoothstep(0., .22, od));
  land = mix(land, ec, clamp(echo, 0., 1.) * .55);
  land += LIGHT * GLOW * exp(-od * 14.) + DEEP * GLOW * .8 * exp(-od * 4.);

  vec3 water;
#if WATER == 1
  vec3 base = mix(D800, DEEP, depth * .8);
  float fk = s * 9. + .7 * snoise(vec3(s * .8, y * 1.2, t * .02));
  float shimmer = smoothstep(-.2, .8, snoise(vec3(s * 1.5, y * 5. + t * .25, t * .05)));
  water = mix(base, mix(L300, WHITE, shimmer * .6), lineAA(fk, 1.2) * (.3 + .7 * shimmer));
  water = mix(water, L300, smoothstep(.82, 1., abs(s)) * .3);
#elif WATER == 2
  water = mix(L300, DEEP, depth * .8);
  float c = caustic(P * 2.4 + vec2(0., t * .015), t * .32);
  water += c * mix(L200, WHITE, .55) * (.18 + .45 * depth);
  water += WHITE * .1 * smoothstep(.22, .0, abs(s - .35 + .12 * sin(y * 6. + t * .3)));
#elif WATER == 3
  float under = lineAA(sqrt(abs(dn) + .004 * snoise(vec3(P * 9., t * .1))) * ECHO * 1.6 + t * .05, 1.);
  water = mix(mix(DARK, DEEP, .8), mix(DEEP, LIGHT, .8), depth * .85);
  water = mix(water, mix(L200, WHITE, .4), under * (.25 + .35 * depth));
#elif WATER == 4
  water = mix(L300, DEEP, depth * .7);
  float silk = snoise(vec3(s * 2.5, y * .9 - t * .05, t * .02)) * .5 + .5;
  float silk2 = snoise(vec3(s * 6., y * 1.6 - t * .09, t * .03 + 3.)) * .5 + .5;
  water = mix(water, mix(L200, WHITE, .55), smoothstep(.55, 1., silk) * .5 + smoothstep(.72, 1., silk2) * .3);
#elif WATER == 5
  vec3 base = mix(DEEP, LIGHT, depth * .7);
  float fk = s * 8. + .7 * snoise(vec3(s * .8, y * 1.2, t * .02));
  float shimmer = smoothstep(-.3, .8, snoise(vec3(s * 1.5, y * 5. + t * .25, t * .05)));
  water = mix(base, WHITE, lineAA(fk, 1.2) * (.25 + .6 * shimmer));
#elif WATER == 6
  float f = depth * 1.2 + .25 * fbm3(vec3(P * 3., t * .03)) - t * .02;
  water = mix(mix(DARK, D800, .85), mix(L300, WHITE, depth * .5), lineAA(f * 14., 1.1) * (.45 + .55 * depth));
#else
  vec2 cc = floor(fc / (3. * uDpr));
  float cov = .3 + .7 * depth * (.75 + .25 * snoise(vec3(s * 2., y * 4. + t * .2, t * .05)));
  water = cov > bayer4(cc) ? LIGHT : DEEP;
#endif
  // A fine bright edge on the water side of the bank.
  water = mix(water, mix(L200, WHITE, .3), exp(-abs(d) * 700.) * .55);
  float aa = fwidth(d);
  float inside = 1. - smoothstep(-aa, aa, d);
  gl_FragColor = vec4(mix(land, water, inside), 1.);
}
