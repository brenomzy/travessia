<script>
window.SHADERS = [
  { id: "n8", title: "8 \u00b7 7i as it was", note: "The chosen look, unchanged.", ref: "River lab 4, tile 7i",
    frag: `#define STREAM 0
#define ECHO 1

float rcx(float y, float t) { return .66 + .13 * sin(y * 4.2 + .6) + .05 * sin(y * 9.1 + 2.3) + .015 * sin(y * 17. + 1.) + .022 * snoise(vec3(y * 2.5, 0., t * .02)); }
float rw(float y, float t) { return mix(.074, .026, smoothstep(0., 1., y)) * (1. + .2 * snoise(vec3(y * 5., 3., t * .015))); }
// A line about px pixels wide wherever k crosses a whole number.
float lineAA(float k, float px) {
  float fw = max(fwidth(k), 1e-4);
  float l = abs(fract(k - .5) - .5) / fw;
  return 1. - smoothstep(px * .5 - .5, px * .5 + .5, l);
}
// One soft line across the river at s0, never thinner than a pixel (sw = one pixel in s units).
float streak(float s, float sw, float s0, float wid) {
  float ww = max(wid, sw * .8);
  return exp(-pow((s - s0) / ww, 2.)) * (wid / ww);
}
// Ten streaks that follow the banks, wander slowly, taper in and out and travel downstream.
float streaks(float s, float sw, float y, float t, float spread, float wmin, float wmax, float seed) {
  float acc = 0.;
  for (int i = 0; i < 10; i++) {
    float fi = float(i);
    float s0 = -.78 + 1.56 * fract(fi * .618 + .13 + seed) + spread * snoise(vec3(y * .9 + fi * 3.1, fi + seed * 10., t * .03));
    float wid = mix(wmin, wmax, fract(fi * .37 + .2 + seed));
    float seg = smoothstep(-.15, .5, snoise(vec3(fi * 7.3 + seed * 13., y * 1.6 + t * .22, t * .04)));
    acc += streak(s, sw, s0, wid) * seg * mix(.55, 1., fract(fi * .73 + seed));
  }
  return clamp(acc, 0., 1.);
}
void main() {
  vec2 fc = gl_FragCoord.xy; vec2 uv = fc / uRes; float asp = uRes.x / uRes.y; float t = uTime; float y = uv.y;
  float e = .002; float cx = rcx(y, t); float sl = (rcx(y + e, t) - rcx(y - e, t)) / (2. * e) * asp;
  float w = rw(y, t);
  float dn = (uv.x - cx) * asp / sqrt(1. + sl * sl);
  float dsm = abs(dn) - w;                                          // smooth bank, for the echoes
  float d = dsm + .0035 * fbm3(vec3(uv * vec2(asp, 1.) * 26., 1.)); // rough bank, for the water edge
  float s = clamp(dn / w, -1., 1.);
  float sw = fwidth(dn / w);
  float depth = 1. - s * s;
  float od = max(d, 0.), ods = max(dsm, 0.);

  vec3 water = mix(L300, DEEP, depth * .75);
#if STREAM == 0
  float flow = y * 3. + t * .1;
  float l1 = pow(1. - abs(snoise(vec3(s * 1.6, flow, t * .03))), 16.);
  float l2 = pow(1. - abs(snoise(vec3(s * 3.2, flow * 2.2 + 4., t * .05 + 2.))), 24.);
  water = mix(water, WHITE, clamp(l1 * .75 + l2 * .5, 0., 1.));
  float crest = smoothstep(.75, 1., abs(s)) * smoothstep(-.2, .6, snoise(vec3(s, y * 22. + t * .35, 1.)));
  water = mix(water, mix(L200, WHITE, .6), crest * .6);
#elif STREAM == 1
  water = mix(water, WHITE, streaks(s, sw, y, t, .22, .022, .06, 0.) * .9);
#elif STREAM == 2
  float rb = streaks(s, sw, y * .6, t * .7, .3, .05, .11, .41);
  float core = streaks(s, sw, y * .6, t * .7, .3, .016, .026, .41);
  water = mix(water, mix(L200, WHITE, .3), rb * .45);
  water = mix(water, WHITE, core * .8);
#elif STREAM == 3
  water = mix(water, mix(L200, WHITE, .35), smoothstep(.62, 1., abs(s)) * .5);
  water = mix(water, WHITE, streaks(s, sw, y, t, .2, .022, .055, 0.) * .9);
#else
  float st1 = streaks(s, sw, y, t, .22, .02, .05, 0.);
  float st2 = streaks(-s, sw, y * 1.3 + 5., t, .3, .016, .04, .27);
  water = mix(water, WHITE, clamp(st1 * .85 + st2 * .55, 0., 1.));
#endif

  vec3 land = DARK + fbm3(vec3(uv * vec2(asp, 1.) * 3., 7.)) * .015;
  land += LIGHT * .1 * exp(-od * 14.) + DEEP * .09 * exp(-od * 4.);
#if ECHO == 0
  float k0 = od * 55.;
  float ring0 = 1. - smoothstep(0., fwidth(k0) * 1.1, abs(fract(k0) - .5));
  land = mix(land, mix(L300, vec3(.75, .82, .85), smoothstep(0., .15, od)), ring0 * .45 * exp(-od * 9.) * step(.004, od));
#else
  float wt = 1., fade = 7., px = 1., k;
#if ECHO == 1
  k = ods * 46. - t * .04;
#elif ECHO == 2
  k = sqrt(ods) * 19. - t * .035;
  px = mix(1.5, .8, smoothstep(0., .2, ods));
#elif ECHO == 3
  k = ods * 46. - t * .04;
  float c2 = (rcx(y + e, t) - 2. * cx + rcx(y - e, t)) / (e * e);
  float outer = smoothstep(-.2, .8, -sign(dn) * c2 * .35);
  fade = mix(18., 5., outer); wt = .3 + .7 * outer;
#else
  k = ods * 40. - t * .04;
#endif
  float ring = lineAA(k, px) * smoothstep(.006, .012, ods) * exp(-ods * fade) * wt;
#if ECHO == 4
  ring *= 1. - smoothstep(.16, .28, abs(fract(fc.y / (6. * uDpr)) - .5));
#endif
  vec3 ec = mix(L300, vec3(.72, .8, .83), smoothstep(0., .18, ods));
  land = mix(land, ec, clamp(ring, 0., 1.) * .6);
#endif
  float aa = fwidth(d) * 1.2;
  float inside = 1. - smoothstep(-aa, aa, d);
  gl_FragColor = vec4(mix(land, water, inside), 1.);
}
` },
  { id: "n8a", title: "8a \u00b7 Centred and calm", note: "A gentle S through the middle of the frame. Symmetric and quiet; suits a section with the copy above or below.", ref: "Course: centred \u00b7 bends move: no \u00b7 width breathes: no \u00b7 flow speed \u00d71",
    frag: `#define SHAPE 2
#define MOVE 0.000
#define BREATH 0.000
#define FLOWK 1.00

// 7i (5j water, clean echoes) on any course. a runs along the river, c across it, both in height units.
float cen(float a, float t) {
  float ph = MOVE * t; float asp = uRes.x / uRes.y;
#if SHAPE == 1
  return (.66 + .13 * sin(a * 4.2 + .6 + ph) + .05 * sin(a * 9.1 + 2.3 + ph * 1.7) + .015 * sin(a * 17. + 1.) + .022 * snoise(vec3(a * 2.5, 0., t * .02))) * asp;
#elif SHAPE == 2
  return (.5 + .07 * sin(a * 3. + .4 + ph) + .025 * sin(a * 7.3 + 1. + ph)) * asp;
#elif SHAPE == 3
  return (.3 + .5 * a + .05 * sin(a * 6. + ph) + .02 * sin(a * 13. + 1.)) * asp;
#elif SHAPE == 4
  return .24 + .07 * sin(a * 2.2 + .3 + ph) + .03 * sin(a * 5.1 + 1.2) + .015 * snoise(vec3(a * 1.5, 5., t * .03));
#elif SHAPE == 5
  return (.7 + .09 * sin(a * 12. + .5 + .4 * sin(a * 3.) + ph) + .03 * sin(a * 25. + 2.)) * asp;
#elif SHAPE == 6
  return (.7 + .17 * sin(a * 2.6 + .9 + ph) + .03 * sin(a * 7. + 1.)) * asp;
#else
  return (.6 + .5 * pow(max(a, 0.), 2.2) + .025 * sin(a * 9. + ph)) * asp;
#endif
}
float wid(float an, float t) {
  float n = snoise(vec3(an * 5., 3., t * .015));
#if SHAPE == 2
  return .05 * (1. + .15 * n);
#elif SHAPE == 3
  return mix(.07, .03, an) * (1. + .2 * n);
#elif SHAPE == 4
  return mix(.03, .062, an) * (1. + .2 * n);
#elif SHAPE == 5
  return .022 * (1. + .2 * n);
#elif SHAPE == 6
  return mix(.11, .05, an) * (1. + .15 * n);
#elif SHAPE == 7
  return mix(.075, .03, an) * (1. + .2 * n);
#else
  return mix(.074, .026, smoothstep(0., 1., an)) * (1. + .2 * n);
#endif
}
float lineAA(float k, float px) {
  float fw = max(fwidth(k), 1e-4);
  float l = abs(fract(k - .5) - .5) / fw;
  return 1. - smoothstep(px * .5 - .5, px * .5 + .5, l);
}
void main() {
  vec2 fc = gl_FragCoord.xy; vec2 uv = fc / uRes; float asp = uRes.x / uRes.y; float t = uTime;
  vec2 P = vec2(uv.x * asp, uv.y);
  float tf = t * FLOWK;
#if SHAPE == 4
  float a = asp - P.x; float c = P.y; float an = clamp(a / asp, 0., 1.);
#else
  float a = P.y; float c = P.x; float an = a;
#endif
  float e = .002;
#if SHAPE == 8
  float split = smoothstep(.4, .95, a);
  float base = (.66 + .05 * sin(a * 6. + .4 + MOVE * t) + .02 * snoise(vec3(a * 3., 0., t * .03))) * asp;
  float cA = base - .2 * asp * split, cB = base + .16 * asp * split;
  float w = .032 + .03 * (1. - split);
  float dn = abs(c - cA) < abs(c - cB) ? c - cA : c - cB;
#else
  float w = wid(an, t);
#if SHAPE == 5 || SHAPE == 7
  // Tight or steep bends: search along the river for the nearest point instead of estimating it.
  float best = 1e5, bi = 0.;
  for (int i = -12; i <= 12; i++) { float ai = a + float(i) * .02; vec2 q = vec2(c - cen(ai, t), a - ai); float dd = dot(q, q); if (dd < best) { best = dd; bi = ai; } }
  float b2 = 1e5, sg = 1.;
  for (int i = -6; i <= 6; i++) { float ai = bi + float(i) * .0035; float ci = cen(ai, t); vec2 q = vec2(c - ci, a - ai); float dd = dot(q, q); if (dd < b2) { b2 = dd; sg = sign(c - ci); } }
  float dn = sqrt(b2) * sg;
#else
  float c0 = cen(a, t); float sl = (cen(a + e, t) - cen(a - e, t)) / (2. * e);
  float dn = (c - c0) / sqrt(1. + sl * sl);
#endif
#endif
  w *= 1. + BREATH * sin(t * .3 + a * 2.);
  float dsm = abs(dn) - w;
  float d = dsm + .0035 * fbm3(vec3(P * 26., 1.));
  float s = clamp(dn / w, -1., 1.);
  float depth = 1. - s * s;
  float od = max(d, 0.), ods = max(dsm, 0.);

  // 5j water, unchanged except that it follows the river's own length (a).
  vec3 water = mix(L300, DEEP, depth * .75);
  float flow = a * 3. + tf * .1;
  float l1 = pow(1. - abs(snoise(vec3(s * 1.6, flow, tf * .03))), 16.);
  float l2 = pow(1. - abs(snoise(vec3(s * 3.2, flow * 2.2 + 4., tf * .05 + 2.))), 24.);
  water = mix(water, WHITE, clamp(l1 * .75 + l2 * .5, 0., 1.));
  float crest = smoothstep(.75, 1., abs(s)) * smoothstep(-.2, .6, snoise(vec3(s, a * 22. + tf * .35, 1.)));
  water = mix(water, mix(L200, WHITE, .6), crest * .6);

  // Clean echoes from the smooth bank.
  vec3 land = DARK + fbm3(vec3(P * 3., 7.)) * .015;
  land += LIGHT * .1 * exp(-od * 14.) + DEEP * .09 * exp(-od * 4.);
  float ring = lineAA(ods * 46. - t * .04, 1.) * smoothstep(.006, .012, ods) * exp(-ods * 7.);
  land = mix(land, mix(L300, vec3(.72, .8, .83), smoothstep(0., .18, ods)), clamp(ring, 0., 1.) * .6);

  float aa = fwidth(d) * 1.2;
  float inside = 1. - smoothstep(-aa, aa, d);
  gl_FragColor = vec4(mix(land, water, inside), 1.);
}
` },
